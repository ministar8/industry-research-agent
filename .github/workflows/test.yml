name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.13.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint and format with ruff
      run: |
        uv run ruff format --check
        uv run ruff check --output-format github

    - name: Type check with pyrefly
      run: |
        uv run pyrefly check

    - name: Test with pytest
      run: |
        uv run pytest --cov=src/ --cov-report=xml

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.13.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --only-group dev
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint markdown with pymarkdown
      run: |
        uv run pymarkdown scan README.md

  test-docker:
    runs-on: ubuntu-latest

    services:
      dind:
        image: docker:dind
        ports:
          - 2375:2375
          # The service runs as an unprivileged user on --network host, so it cannot
          # bind ports below 1024 (the host netns keeps ip_unprivileged_port_start=1024).
          - 8000:8000
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: industry-research-agent.service:${{ github.sha }}
          file: docker/Dockerfile.service

      - name: Start PostgreSQL container
        run: |
          docker run -d --name postgres --network host \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=agent_service \
            postgres:16
          timeout 60 bash -c '
            until docker exec postgres pg_isready -U postgres -d agent_service; do
              echo "Waiting for PostgreSQL to be ready..."
              sleep 2
            done
          '

      - name: Start service container
        run: |
          docker run -d --name service-container --network host \
            -e USE_FAKE_MODEL=true \
            -e PORT=8000 \
            -e DATABASE_TYPE=postgres \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=agent_service \
            industry-research-agent.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          timeout 30 bash -c '
            while ! curl -sf http://localhost:8000/health; do
              if [ "$(docker inspect -f "{{.State.Running}}" service-container)" != "true" ]; then
                echo "Service container exited with code $(docker inspect -f "{{.State.ExitCode}}" service-container)"
                docker logs service-container
                exit 1
              fi
              echo "Waiting for service to be ready..."
              sleep 2
            done
          '

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.13.5"
      - name: Install ONLY CLIENT dependencies with uv
        run: |
          uv sync --frozen --only-group client --only-group dev
        env:
          UV_SYSTEM_PYTHON: 1
      - name: Run integration and persistence smoke tests
        run: |
          SMOKE_SERVICE_URL=http://localhost:8000 uv run pytest tests/integration tests/smoke -v --run-docker

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container || true
          docker rm service-container || true
          docker stop postgres || true
          docker rm postgres || true
